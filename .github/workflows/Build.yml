name: Build

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  windows:
    name: windows-2025
    runs-on: windows-2025
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build ToadDesign.slnx -c Release

      - name: Test (plain and ILRepack-merged, both targets)
        shell: bash
        env:
          CONFIGURATION: Release
        run: sh tests/run.sh
